{% extends "client/layout_client.html" %}
{% block body %}

<div class="m-auto p-3 border" style="width: 500px">
    <form action="/client/coordonnee/edit_adresse" method="post">
        <input type="hidden" name="id_adresse" value="{{ adresse.id_adresse }}">

        <table class="table">
            <tr>
                <td>Utilisateur connecté :</td>
                <td>nom : {{ utilisateur.nom }} , login : {{ utilisateur.login }}</td>
            </tr>
            <tr>
                <td>Nom Prénom (pour la livraison/facturation) :</td>
                <td><input type="text" name="nom" required maxlength="50" class="form-control" value="{{ adresse.nom }}"></td>
            </tr>
            <tr>
                <td>Numéro de rue et nom :</td>
                <td><input type="text" name="rue" required class="form-control" value="{{ adresse.rue }}"></td>
            </tr>
            <tr>
                <td>Code postal :</td>
                <td><input type="text" name="code_postal" required maxlength="5" class="form-control" value="{{ adresse.code_postal }}"></td>
            </tr>
            <tr>
                <td>Ville :</td>
                <td><input type="text" name="ville" required maxlength="50" class="form-control" value="{{ adresse.ville }}"></td>
            </tr>
        </table>
        <button class="btn btn-primary" type="submit">Valider</button>
        <a href="/client/coordonnee/show" class="btn btn-secondary">Retour</a>
    </form>
</div>
{% endblock %}
