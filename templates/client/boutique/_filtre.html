<form action="/client/panier/filtre" method="post">
    <div class="mb-2">
        <label>Nom contient :</label>
        <input type="text" name="filter_word" class="form-control" value="{{ session.get('filter_word', '') }}">
    </div>
    <div class="mb-2">
        <label>Prix min (€) :</label>
        <input type="number" name="filter_prix_min" class="form-control" value="{{ session.get('filter_prix_min', '') }}">
    </div>
    <div class="mb-2">
        <label>Prix max (€) :</label>
        <input type="number" name="filter_prix_max" class="form-control" value="{{ session.get('filter_prix_max', '') }}">
    </div>
    <div class="mb-2">
        <label>Type :</label>
        {% for item in items_filtre %}
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="filter_types" value="{{ item.id_type_article }}"
                    {% if session.get('filter_types') and item.id_type_article|string in session.get('filter_types') %}checked{% endif %}>
                <label class="form-check-label">{{ item.libelle_type }}</label>
            </div>
        {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary btn-sm">Filtrer</button>
</form>
<form action="/client/panier/filtre/suppr" method="post" class="mt-2">
    <button type="submit" class="btn btn-secondary btn-sm">Effacer les filtres</button>
</form>
