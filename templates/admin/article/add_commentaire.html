{% extends 'admin/layout_admin.html' %}
{% block title %}<title>Répondre à un commentaire</title>{% endblock %}
{% block body %}
<div class="container mt-4" style="max-width:600px;">
  <h3>Répondre au commentaire #{{ id_commentaire }}</h3>
  <form method="post" action="/admin/article/commentaires/repondre">
    <input type="hidden" name="id_article" value="{{ id_article }}">
    <input type="hidden" name="id_commentaire_parent" value="{{ id_commentaire }}">
    <div class="mb-3">
      <label class="form-label">Votre réponse</label>
      <textarea name="commentaire" class="form-control" rows="5"
                placeholder="Réponse de l'administrateur..." required></textarea>
    </div>
    <button type="submit" class="btn btn-success">Publier la réponse</button>
    <a href="/admin/article/commentaires?id_article={{ id_article }}"
       class="btn btn-outline-secondary ms-2">Annuler</a>
  </form>
</div>
{% endblock %}
